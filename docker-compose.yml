services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-расим-и-анна.рф}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
